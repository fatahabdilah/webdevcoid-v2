<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>webdev Content Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Studio webdev.co.id: instrument panel untuk Mic. Sidebar bergrup (Design, Sales) dengan subpage berpohon;
   area kerja = grid 12 kolom berisi modul bergaris tipis dengan tanda sudut, di atas grid titik.
   Dark-first, satu sinyal biru brand, mint = selesai, amber = giliran Mic, rose = telat.
   Huruf: Inter Tight untuk kata, Geist Mono untuk label, ID, tanggal, dan angka. */
:root{
  --bg:#050507; --surface:#101013; --raised:#16161a; --sunken:#0b0b0e; --inset:#1f1f24; --hover:#1a1a1f;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.17);
  --ink:#f3f3f5; --ink-2:rgba(236,236,242,.66); --ink-3:rgba(220,220,232,.44);
  --accent:#2a62ff; --accent-ink:#ffffff; --accent-text:#8ca9ff; --accent-soft:rgba(42,98,255,.16); --glow:rgba(42,98,255,.22);
  --you:#ffb547; --you-soft:rgba(255,181,71,.12); --you-text:#ffc978;
  --bad:#ff8895; --bad-soft:rgba(255,136,149,.12);
  --ok:#76e4b8; --ok-soft:rgba(118,228,184,.12); --ok-text:#76e4b8;
  --team-soft:rgba(42,98,255,.14); --team-text:#8ca9ff; --wait-soft:rgba(255,255,255,.05);
  --s-backlog:#2a2c36; --s-research:#142f86; --s-writing:#1d47c9; --s-design:#2a62ff; --s-review:#8ca9ff;
  --s-approval:#ffb547; --s-approved:#76e4b8; --s-published:#3fc495;
  --p-edukasi:#5b84ff; --p-bukti:#3fc495; --p-proses:#9a7bf0; --p-penawaran:#e25d86;
  --pop:0 30px 80px -20px rgba(0,0,0,.75), 0 2px 8px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.55);
  --dot:rgba(226,230,242,.1);
  --f-sans:"Inter Tight","Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:2px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --tab-h:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#eceef4; --surface:#f8f9fc; --raised:#fdfdfe; --sunken:#e7e9f0; --inset:#dfe2eb; --hover:#e4e7ef;
  --line:rgba(40,48,80,.12); --line-2:rgba(40,48,80,.28);
  --ink:#0e1020; --ink-2:#4d5469; --ink-3:#7a8096;
  --accent:#2a62ff; --accent-ink:#ffffff; --accent-text:#1d4fd8; --accent-soft:rgba(42,98,255,.11); --glow:rgba(42,98,255,.14);
  --you:#c27400; --you-soft:rgba(194,116,0,.11); --you-text:#8f5400;
  --bad:#d23e4c; --bad-soft:rgba(210,62,76,.1);
  --ok:#128a5e; --ok-soft:rgba(18,138,94,.1); --ok-text:#0b6e4a;
  --team-soft:rgba(42,98,255,.1); --team-text:#1d4fd8; --wait-soft:rgba(40,48,80,.06);
  --s-backlog:#cfd2dc; --s-research:#a9beff; --s-writing:#6e92ff; --s-design:#2a62ff; --s-review:#1236b8;
  --s-approval:#e09a1e; --s-approved:#1f9e70; --s-published:#0b5e40;
  --p-edukasi:#2a62ff; --p-bukti:#1f9e70; --p-proses:#7b5be0; --p-penawaran:#d0416d;
  --pop:0 30px 80px -24px rgba(16,24,40,.3), 0 2px 8px rgba(16,24,40,.07);
  --scrim:rgba(14,16,32,.32);
  --dot:rgba(30,38,70,.1);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#eceef4; --surface:#f8f9fc; --raised:#fdfdfe; --sunken:#e7e9f0; --inset:#dfe2eb; --hover:#e4e7ef;
  --line:rgba(40,48,80,.12); --line-2:rgba(40,48,80,.28);
  --ink:#0e1020; --ink-2:#4d5469; --ink-3:#7a8096;
  --accent:#2a62ff; --accent-ink:#ffffff; --accent-text:#1d4fd8; --accent-soft:rgba(42,98,255,.11); --glow:rgba(42,98,255,.14);
  --you:#c27400; --you-soft:rgba(194,116,0,.11); --you-text:#8f5400;
  --bad:#d23e4c; --bad-soft:rgba(210,62,76,.1);
  --ok:#128a5e; --ok-soft:rgba(18,138,94,.1); --ok-text:#0b6e4a;
  --team-soft:rgba(42,98,255,.1); --team-text:#1d4fd8; --wait-soft:rgba(40,48,80,.06);
  --s-backlog:#cfd2dc; --s-research:#a9beff; --s-writing:#6e92ff; --s-design:#2a62ff; --s-review:#1236b8;
  --s-approval:#e09a1e; --s-approved:#1f9e70; --s-published:#0b5e40;
  --p-edukasi:#2a62ff; --p-bukti:#1f9e70; --p-proses:#7b5be0; --p-penawaran:#d0416d;
  --pop:0 30px 80px -24px rgba(16,24,40,.3), 0 2px 8px rgba(16,24,40,.07);
  --scrim:rgba(14,16,32,.32);
  --dot:rgba(30,38,70,.1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-sans);letter-spacing:-.005em;font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased;scrollbar-color:var(--line-2) transparent}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
::selection{background:var(--accent);color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent-text);text-underline-offset:3px}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.025em;text-wrap:balance}
p{margin:0}
code{font-family:var(--f-mono);font-size:12px}
.ic{flex:none;display:block}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.muted{color:var(--ink-3)}
.lbl{font:500 10.5px/1.25 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}

/* ---------- shell + sidebar ---------- */
.shell{--side-w:268px;position:relative;z-index:1;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .32s var(--ease)}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:18px;padding:18px 14px 16px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:30;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:11px;padding:2px 4px 18px;border-bottom:1px solid var(--line);min-width:0}
.brand-mark{width:30px;height:30px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 28%,#9ab8ff 0%,#236ef3 32%,#0346d6 58%,#011f6c 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 0 18px -4px rgba(42,98,255,.7)}
.brand-txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.brand-txt b{font:600 15px/1.05 var(--f-sans);letter-spacing:-.02em;white-space:nowrap}
.side-toggle{width:28px;height:28px;flex:none;border:1px solid var(--line);border-radius:var(--r);display:grid;place-items:center;color:var(--ink-2);background:none;transition:border-color .15s,color .15s}
.side-toggle:hover{border-color:var(--line-2);color:var(--ink)}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-h{padding:0 6px 2px}
.grp-h{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 14px 0 13px;border:0;border-radius:999px;background:none;color:var(--ink-2);font:500 14.5px/1 var(--f-sans);letter-spacing:-.01em;text-align:left;white-space:nowrap;transition:background .2s,color .2s}
.grp-h:hover{background:var(--hover);color:var(--ink)}
.grp.active .grp-h{background:var(--ink);color:var(--bg)}
.grp-h .gx{margin-left:auto;display:grid;place-items:center;opacity:.8}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:999px;font:500 10.5px/20px var(--f-mono);text-align:center;background:var(--ink);color:var(--bg)}
.cnt.you{background:var(--you);color:#1a1206}
.grp.active .grp-h .cnt{background:var(--bg);color:var(--ink)}
.grp.active .grp-h .cnt.you{background:var(--you);color:#1a1206}
.sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.grp.open .sub{grid-template-rows:1fr}
.sub-in{min-height:0;overflow:hidden}
.sub-list{position:relative;display:flex;flex-direction:column;gap:2px;padding:8px 0 6px 36px}
.sub-list::before{content:"";position:absolute;left:24px;top:12px;bottom:12px;width:1px;background:var(--line-2)}
.sub-i{position:relative;display:flex;align-items:center;gap:11px;width:100%;height:40px;padding:0 10px 0 12px;border-radius:999px;border:1px solid transparent;background:none;color:var(--ink-2);font:400 13.5px/1 var(--f-sans);text-align:left;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.sub-i:hover{color:var(--ink);background:var(--hover)}
.sub-i[aria-current="page"]{background:var(--raised);border-color:var(--line-2);color:var(--ink);box-shadow:0 8px 20px -14px rgba(0,0,0,.7)}
.sub-i[aria-current="page"]::before{content:"";position:absolute;left:-14.5px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg),0 0 10px var(--accent)}
.sub-i .k{margin-left:auto;font:500 9.5px/1 var(--f-mono);color:var(--ink-3);border:1px solid var(--line);padding:3px 5px;border-radius:var(--r)}
.sub-i .cnt{margin-left:auto}
.side-today{display:flex;flex-direction:column;gap:7px;padding:13px 12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r)}
.side-date{display:flex;align-items:baseline;gap:8px}
.side-date b{font:300 38px/1 var(--f-sans);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.side-prog{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.side-prog .lbl{display:flex;justify-content:space-between;gap:8px}
.bar-track{height:3px;background:var(--inset);overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent);transition:width .7s var(--ease)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot .btn{width:100%}
.sync{display:flex;align-items:center;gap:9px;border:1px solid var(--line);padding:9px 10px;border-radius:var(--r);background:var(--surface);min-width:0}
.sync .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.06em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px var(--ok-soft);animation:pulse 2.4s ease-in-out infinite}
.sync.off .dot{background:var(--you);box-shadow:0 0 0 3px var(--you-soft);animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 5px transparent}}
.side-keys{font-size:9.5px;color:var(--ink-3);padding-inline:4px}
@media (min-width:768px){
  .shell.collapsed{--side-w:76px}
  .shell.collapsed .side{padding-inline:12px;align-items:center}
  .shell.collapsed .brand{flex-direction:column;gap:14px;padding:2px 0 18px;width:100%}
  .shell.collapsed .brand-txt,.shell.collapsed .nav-h,.shell.collapsed .grp-h .gl,.shell.collapsed .grp-h .gx,.shell.collapsed .sub-i .sl,.shell.collapsed .sub-i .k,.shell.collapsed .side-today,.shell.collapsed .side-keys,.shell.collapsed .sync .lbl,.shell.collapsed .side-foot .btn .bl{display:none}
  .shell.collapsed .side-toggle svg{transform:scaleX(-1)}
  .shell.collapsed .nav{width:100%;align-items:center}
  .shell.collapsed .grp{display:flex;flex-direction:column;align-items:center;width:100%}
  .shell.collapsed .grp-h{width:48px;height:48px;padding:0;justify-content:center;border-radius:50%}
  .shell.collapsed .grp.active .grp-h{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
  .shell.collapsed .grp-h .cnt{position:absolute;top:-2px;right:-4px;min-width:17px;height:17px;line-height:17px;padding:0 4px;font-size:9.5px}
  .shell.collapsed .sub-list{padding:10px 0 8px;align-items:center}
  .shell.collapsed .sub-list::before{left:50%}
  .shell.collapsed .sub-i{width:36px;height:36px;padding:0;justify-content:center;border-radius:50%;background:var(--bg)}
  .shell.collapsed .sub-i:hover{background:var(--hover)}
  .shell.collapsed .sub-i[aria-current="page"]{background:var(--raised)}
  .shell.collapsed .sub-i[aria-current="page"]::before{display:none}
  .shell.collapsed .sub-i .cnt{position:absolute;top:-3px;right:-5px;min-width:16px;height:16px;line-height:16px;padding:0 4px;font-size:9px}
  .shell.collapsed .side-foot{width:100%;align-items:center}
  .shell.collapsed .side-foot .btn{width:44px;height:44px;padding:0}
  .shell.collapsed .sync{justify-content:center;width:44px;height:34px;padding:0}
}
.topbar{display:none}
.tabbar{display:none}
main{min-width:0;padding-block:28px 80px;padding-inline:clamp(20px,2.4vw,44px);max-width:1760px}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 11px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,transform .12s,color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px -12px var(--accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 86%,#ffffff)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#04150c}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.sm{min-height:30px;padding:0 11px;font-size:10.5px}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.icon-btn{width:34px;height:34px;border-radius:var(--r);display:inline-grid;place-items:center;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);flex:none}
.icon-btn:hover{border-color:var(--ink-3)}
.icon-btn.bare{border-color:transparent;background:transparent}
.icon-btn.bare:hover{background:var(--hover)}

.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r);font:500 9.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;background:var(--wait-soft);color:var(--ink-2);border:1px solid var(--line)}
.t-team,.t-info{background:var(--accent-soft);color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.t-you{background:var(--you-soft);color:var(--you-text);border-color:color-mix(in srgb,var(--you) 40%,transparent)}
.t-done{background:var(--ok-soft);color:var(--ok-text);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.t-bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.id{font:500 11.5px/1 var(--f-mono);color:var(--ink-2);letter-spacing:0}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;flex:none;font:600 11px/1 var(--f-sans);color:#ffffff;background:#1d3f9c}
.av.adrian{background:#2a6b8f}.av.supri{background:#5a4bb3}.av.darno{background:#1f7a62}.av.michael{background:#1d47c9}
.av.mic{background:#ffb547;color:#1a1206}
.av.bagas{background:#0f4f6e}.av.rani{background:#7b3f8f}.av.yudi{background:#8a5a12}.av.joko{background:#2f6b3a}.av.laras{background:#a8365e}.av.wawan{background:#25507a}.av.hendra{background:#4b4f5e}
.av.lg{width:34px;height:34px;font-size:13px}
.pdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* modul: garis tipis + tanda sudut */
.w,.panel{--t:var(--line-2);--ticks:linear-gradient(var(--t),var(--t)) left top/9px 1px no-repeat,linear-gradient(var(--t),var(--t)) left top/1px 9px no-repeat,linear-gradient(var(--t),var(--t)) right top/9px 1px no-repeat,linear-gradient(var(--t),var(--t)) right top/1px 9px no-repeat,linear-gradient(var(--t),var(--t)) left bottom/9px 1px no-repeat,linear-gradient(var(--t),var(--t)) left bottom/1px 9px no-repeat,linear-gradient(var(--t),var(--t)) right bottom/9px 1px no-repeat,linear-gradient(var(--t),var(--t)) right bottom/1px 9px no-repeat;
  position:relative;min-width:0;border:1px solid var(--line);border-radius:var(--r);background:var(--ticks),linear-gradient(180deg,var(--raised),var(--surface));background-origin:border-box;transition:border-color .2s}
.w{display:flex;flex-direction:column}
.w:hover{border-color:var(--line-2);--t:var(--accent)}
.panel-h,.w-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 4px;flex-wrap:wrap;min-height:44px}
.panel-h h2,.w-h h2{font:500 10.5px/1.25 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.panel-h .sub,.w-h .sub{font-size:12px;color:var(--ink-3)}
.panel-b{padding:8px 16px 16px}
.w-b{padding:10px 16px 16px;flex:1;display:flex;flex-direction:column;min-width:0}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border:1px dashed var(--line-2);border-radius:var(--r);background:color-mix(in srgb,var(--sunken) 60%,transparent);color:var(--ink-2);font-size:13px}
.empty b{color:var(--ink);font-weight:500;font-size:14px}

.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin-bottom:22px}
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.crumb span{color:var(--ink-3)}
.crumb i{width:6px;height:6px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.vh h1{font:400 30px/1.12 var(--f-sans);letter-spacing:-.035em;max-width:30ch}
.vh h1 .soft{color:var(--ink-3)}
.vh .lede{margin-top:10px;color:var(--ink-2);max-width:64ch;font-size:14px}
.vh-act{display:flex;gap:8px;flex-wrap:wrap}

/* sampul post gaya brand (holo radial) */
.cover{position:relative;aspect-ratio:4/5;width:100%;max-width:100%;border-radius:var(--r);overflow:hidden;container-type:inline-size;background:radial-gradient(130% 95% at var(--cx,50%) 0%,#236ef3 0%,#0346d6 24%,#011f6c 56%,#05070d 92%);color:#ffffff;display:grid;place-items:center;padding:12%;text-align:center}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .cv{font-weight:600;text-transform:uppercase;letter-spacing:-.02em;line-height:1.06;font-size:10cqi;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.cover.setup{background:var(--inset);color:var(--ink-3)}
.thumb{width:40px;flex:none;display:block}
.thumb .cover{padding:8%}
.thumb .cover .cv{font-size:12cqi;-webkit-line-clamp:5}

/* ---------- grid ---------- */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px;align-items:stretch}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.stackcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.stackcol > .w{flex:none}
.stackcol > .w:last-child{flex:1}
.arrow{width:30px;height:30px;border-radius:var(--r);display:grid;place-items:center;border:1px solid var(--line-2);background:transparent;color:var(--ink);flex:none;transition:transform .2s var(--ease),background .15s,border-color .15s}
.arrow:hover{transform:rotate(45deg);background:var(--hover);border-color:var(--ink-3)}

/* kpi */
.kpi{padding:14px 16px 16px;gap:12px}
.kpi-h{display:flex;align-items:center;gap:10px}
.kpi-ic{width:28px;height:28px;border-radius:var(--r);display:grid;place-items:center;border:1px solid var(--line);color:var(--ink-2);flex:none}
.kpi-l{font:500 10.5px/1.25 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);flex:1;min-width:0}
.kpi-n{font:300 52px/.95 var(--f-sans);letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin-top:auto}
.kpi-n small{font:400 13px var(--f-mono);letter-spacing:0;color:var(--ink-3);margin-left:6px}
.kpi-f{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3);min-height:26px;flex-wrap:wrap;border-top:1px dashed var(--line-2);padding-top:10px}
.kpi.bad .kpi-n{color:var(--bad)} .kpi.bad .kpi-ic{border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad)}
.kpi.warn .kpi-ic{border-color:color-mix(in srgb,var(--you) 40%,transparent);color:var(--you-text)}
.kpi.hero{--t:rgba(255,255,255,.7);border-color:transparent;color:#ffffff;background:var(--ticks),radial-gradient(120% 140% at 100% 0%,#236ef3 0%,#0346d6 30%,#011f6c 62%,#05070d 100%);box-shadow:0 22px 50px -26px rgba(3,70,214,.9)}
.kpi.hero:hover{--t:#ffffff;border-color:transparent}
.kpi.hero .kpi-l{color:rgba(255,255,255,.8)} .kpi.hero .kpi-ic{border-color:rgba(255,255,255,.28);color:#ffffff}
.kpi.hero .kpi-n small,.kpi.hero .kpi-f{color:rgba(255,255,255,.75)}
.kpi.hero .kpi-f{border-color:rgba(255,255,255,.25)}
.kpi.hero .arrow{border-color:rgba(255,255,255,.3);color:#ffffff}
.kpi.hero .arrow:hover{background:rgba(255,255,255,.12)}
.stack{display:flex}
.stack .st{width:22px;margin-left:-7px;box-shadow:0 0 0 2px #0a1a52}
.stack .st:first-child{margin-left:0}
.stack .cover{padding:0}.stack .cover .cv{display:none}
.pticks{display:flex;gap:3px;align-items:flex-end}
.pticks i{width:5px;height:20px;display:block}
.ticks{display:inline-flex;gap:2px;align-items:center}
.ticks i{width:4px;height:13px;background:var(--inset);display:block}
.ticks i.on{background:var(--accent)}
.ticks i.cur{background:var(--you)}

/* ---------- Hari ini ---------- */
.q-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 4px}
.q-row + .q-row{border-top:1px solid var(--line)}
.q-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.q-title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;padding:0;text-align:left;color:inherit}
button.q-title:hover{color:var(--accent-text)}
.q-why{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q-act{display:flex;gap:6px;align-items:center}
.ibox{width:40px;height:50px;border-radius:var(--r);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-3);flex:none}
.idlink{font:500 11px/1 var(--f-mono);border:1px solid var(--line-2);background:none;color:var(--ink);padding:4px 6px;border-radius:var(--r)}
.idlink:hover{border-color:var(--accent);color:var(--accent-text)}
.qf{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.qf::-webkit-scrollbar{display:none}

.feed{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 0}
.fi + .fi{border-top:1px solid var(--line)}
.fi .msg{font-size:13.5px;overflow-wrap:anywhere;color:var(--ink)}
.fi .msg .idlink{margin-right:6px;vertical-align:1px}
.fi .when{font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.fi .reply{font-size:13px;color:var(--ink-2);margin-top:8px;padding:8px 10px;border-left:2px solid var(--accent);background:var(--accent-soft)}

/* siapa ngerjain apa */
.trk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:10px 0 4px}
.sta{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 6px;border:0;background:none;color:inherit;min-width:0}
.sta:not(:first-child)::before,.sta.in:not(:first-child)::after{content:"";position:absolute;top:23px;left:calc(-50% + 30px);right:calc(50% + 30px);height:1px;background:var(--line-2)}
.sta.in:not(:first-child)::after{background:linear-gradient(90deg,transparent,var(--accent) 50%,transparent) no-repeat;background-size:45% 100%;animation:beam 1.9s linear infinite;height:2px;top:22.5px}
@keyframes beam{from{background-position:-90% 0}to{background-position:190% 0}}
.sta-av{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.sta-av .av{width:48px;height:48px;font-size:16px;box-shadow:0 0 0 4px var(--surface)}
.sta:not(.in) .sta-av .av{filter:saturate(.2) brightness(.8);opacity:.5}
.sta.in .sta-av::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--accent);animation:ring 2.4s var(--ease) infinite}
.sta.you.in .sta-av::after{border-color:var(--you)}
@keyframes ring{0%{transform:scale(.92);opacity:.9}70%{transform:scale(1.18);opacity:0}100%{opacity:0}}
.sta-n{position:absolute;top:-4px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:#ffffff;font:500 10.5px/20px var(--f-mono);box-shadow:0 0 0 3px var(--surface)}
.sta.you .sta-n{background:var(--you);color:#1a1206}
.sta-l{font-size:13.5px;font-weight:500;line-height:1.2}
.sta-p{font:500 9.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:-4px}
.sta-ids{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:22px}
.sta-ids .more{font:500 10.5px var(--f-mono);color:var(--ink-3);align-self:center}
.sta:hover .sta-l{color:var(--accent-text)}
.runs{display:flex;flex-direction:column;margin-top:14px;border-top:1px dashed var(--line-2)}
.runs-h{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px}
.runs-h span{font-size:12px;color:var(--ink-3)}
.run{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr) 190px minmax(0,190px) 112px;gap:18px;align-items:center;padding:12px 10px;margin:0 -10px;border:0;border-radius:var(--r);background:none;text-align:left;color:inherit;width:calc(100% + 20px)}
.run + .run{box-shadow:0 -1px 0 var(--line)}
.run:hover{background:var(--hover)}
.run-who{display:flex;align-items:center;gap:10px;min-width:0}
.run-who b{display:block;font-weight:500;font-size:13.5px}
.run-who em{display:block;font-style:normal;font-size:12px;color:var(--accent-text)}
.run-who em.you{color:var(--you-text)}
.run-task{min-width:0}
.run-task .tt{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-task .tt .id{margin-right:7px}
.run-task .ll{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.run-st{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2)}
.run-st .since{color:var(--ink-3)}
.run-nx{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);min-width:0}
.run-nx .ic{color:var(--ink-3)}
.run-nx .av{width:22px;height:22px;font-size:10px}
.run-nx span.l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-due{justify-self:end}

/* spotlight post berikutnya */
.spot{--t:var(--accent)}
.spot::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 50% at 0% 0%,var(--glow),transparent 70%)}
.spot > *{position:relative}
.spot-top{display:flex;gap:14px;align-items:flex-start;padding:16px 16px 0}
.spot-cv{width:92px;flex:none;box-shadow:0 14px 30px -14px rgba(3,70,214,.8)}
.spot-cv .cover .cv{font-size:11cqi}
.pill-g{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r);font:500 9.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent-text);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.spot-n{font:300 36px/1 var(--f-sans);letter-spacing:-.045em;margin-top:12px}
.spot-d{font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
.spot h3{font-size:16.5px;line-height:1.3;padding:14px 16px 0;font-weight:500}
.spot-tags{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 0}
.spot-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:auto;padding:14px 16px;border-top:1px dashed var(--line-2)}
.spot-f .pr{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.spot-gap{flex:1;min-height:14px}
.spot-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 6px;padding:16px 16px 0}
.ss{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:11.5px;color:var(--ink-3)}
.ss i{height:3px;background:var(--inset)}
.ss.done i{background:var(--accent)}
.ss.cur i{background:var(--you)}
.ss.cur{color:var(--ink);font-weight:500}
.ss span,.ss em{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss em{font-style:normal;font:500 9px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

/* kalender */
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-h b{font-weight:500;font-size:14px}
.cal-h .nav2{display:flex;gap:4px}
.cal-h .nav2 button{width:26px;height:26px;border-radius:var(--r);border:1px solid var(--line-2);background:transparent;color:var(--ink-2);display:grid;place-items:center}
.cal-h .nav2 button:hover{color:var(--ink);border-color:var(--ink-3)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:12px;text-align:center}
.cal .wd{font:500 9.5px var(--f-mono);color:var(--ink-3);padding-bottom:4px}
.cal button{position:relative;height:36px;width:100%;border:0;background:var(--sunken);border-radius:1px;font:500 12px var(--f-mono);color:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.cal button:hover{background:var(--hover);color:var(--ink)}
.cal button.out{opacity:.4}
.cal button.td{background:var(--accent);color:#ffffff}
.cal button.sel{box-shadow:0 0 0 1.5px var(--bg),0 0 0 2.5px var(--ink)}
.cal button .dots{display:flex;gap:2px;height:4px}
.cal button .dots i{width:4px;height:4px;border-radius:50%}
.cal button.td .dots i{box-shadow:0 0 0 1px #ffffff}
.ev{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.ev-i{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r);background:var(--sunken);border:1px solid var(--line);text-align:left;color:inherit;width:100%}
.ev-i:hover{border-color:var(--line-2)}
.ev-i .thumb{width:30px}
.ev-i .t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-i .m{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-3);margin-top:3px;flex-wrap:wrap}

/* chart */
.chart-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.chart-head .big{font:300 34px/1 var(--f-sans);letter-spacing:-.045em}
.chart-head .big small{font-size:12.5px;color:var(--ink-3);letter-spacing:0;margin-left:8px;font-weight:400}
.lkey{display:flex;gap:14px;font:500 9.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.lkey span{display:inline-flex;align-items:center;gap:6px}
.lkey i{width:16px;height:0;border-top:2px solid var(--accent)}
.lkey i.dash{border-top:2px dashed var(--ink-3)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart .gl{stroke:var(--line);stroke-width:1}
svg.chart .tx{fill:var(--ink-3);font:500 10px var(--f-mono)}
svg.chart .plan{fill:none;stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:4 4}
svg.chart .act{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
svg.chart .area{fill:url(#chartFill)}
svg.chart .now{stroke:var(--accent);stroke-width:1;stroke-dasharray:2 3;opacity:.7}
svg.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg.chart .hc{fill:transparent}
svg.chart .hc:hover{fill:var(--line)}
.chart-stop{stop-color:var(--accent)}
.heat{display:grid;grid-template-columns:76px repeat(var(--n),minmax(0,1fr));gap:4px;align-items:center}
.heat .rl{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.heat .rl .av{width:20px;height:20px;font-size:9.5px}
.heat .cl{font:500 9.5px var(--f-mono);color:var(--ink-3);text-align:center}
.heat .cl.td{color:var(--accent-text)}
.heat .cell{aspect-ratio:1.25;border-radius:1px;background:var(--inset);transition:transform .15s}
.heat .cell:hover{transform:scale(1.15);box-shadow:0 0 0 1px var(--ink-2)}
.heat-l{display:flex;align-items:center;gap:5px;justify-content:flex-end;font:500 9.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:12px}
.heat-l i{width:10px;height:10px;border-radius:1px}

/* ---------- Approval ---------- */
.appr{display:grid;grid-template-columns:340px minmax(0,1fr);gap:10px;align-items:start}
.al{position:sticky;top:20px;max-height:calc(100dvh - 40px);display:flex;flex-direction:column}
.al .seg{margin:12px 12px 6px;align-self:flex-start}
.al-list{overflow-y:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:2px}
.al-i{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:9px 8px;border-radius:var(--r);border:1px solid transparent;background:none;text-align:left;color:inherit;width:100%}
.al-i:hover{background:var(--hover)}
.al-i[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.al-i .t{font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px}
.al-i .m{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.al-i .m .d{font-size:12px;color:var(--ink-3)}
.al-group{font:500 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:12px 8px 4px}
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:var(--r);background:var(--sunken);border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;border-radius:1px;padding:7px 11px;font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.seg .n{color:var(--ink-3)}
.ad{display:flex;flex-direction:column;min-width:0}
.ad-head{padding:18px 20px 16px;display:flex;flex-direction:column;gap:10px}
.ad-head .row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ad-head h2{font:400 23px/1.2 var(--f-sans);letter-spacing:-.03em;max-width:34ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:var(--ink-2)}
.facts > span{display:inline-flex;gap:7px;align-items:center}
.facts .ic{color:var(--ink-3)}
.facts .av{width:20px;height:20px;font-size:9.5px}
.back{display:none}
.sec{padding:16px 20px;border-top:1px solid var(--line)}
.sec-h{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.decide{position:sticky;bottom:0;z-index:5;display:flex;flex-direction:column;gap:10px;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line-2)}
.decide-row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.decide-note{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start}
.decide-note .ic{margin-top:2px}
.decide-note.warn{color:var(--you-text)}
.decide.is-pend .decide-note{color:var(--accent-text)}
.decide label{font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
textarea{width:100%;min-height:92px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--sunken);padding:10px 12px;resize:vertical;outline:none;line-height:1.5}
textarea:focus,select:focus,input:focus{border-color:var(--accent)}
textarea::placeholder,input::placeholder{color:var(--ink-3)}
.car{position:relative;padding:22px 0 14px;background:var(--sunken);overflow:hidden;touch-action:pan-y}
.car-stage{position:relative;height:340px;perspective:1200px}
.car-item{position:absolute;left:50%;top:0;width:auto;height:100%;aspect-ratio:4/5;max-width:62%;padding:0;border:0;border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--pop);transform-origin:50% 50%}
.car-item img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none}
.car-ctl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px;font-size:12.5px;color:var(--ink-2)}
.noslides{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;align-items:center;padding:20px;background:var(--sunken)}
.noslides b{font-weight:500;display:block;margin-bottom:4px}
.noslides p{color:var(--ink-2);font-size:13px;max-width:52ch;margin-bottom:10px}
.md{font-size:13.5px;line-height:1.65;color:var(--ink-2);overflow-wrap:anywhere;max-width:76ch}
.md h1,.md h2,.md h3{color:var(--ink);margin:18px 0 6px;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.md h1{font-size:16px;margin-top:0}
.md p{margin:8px 0}
.md ul,.md ol{padding-left:20px;margin:8px 0}
.md li{margin:3px 0}
.md code{background:var(--sunken);padding:1px 5px;border-radius:var(--r)}
.md table{font-size:12.5px;margin:10px 0;display:block;overflow-x:auto;border-collapse:collapse}
.md td,.md th{padding:6px 9px;border:1px solid var(--line);text-align:left}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:2px solid var(--line-2);background:var(--sunken)}
.md strong{color:var(--ink);font-weight:600}
.fb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:8px 0;font-size:13px}
.fb .ck{width:16px;height:16px;border-radius:1px;box-shadow:inset 0 0 0 1px var(--ink-3);display:grid;place-items:center;margin-top:2px}
.fb .ck.on{background:var(--ok);box-shadow:none;color:#04150c}
.fb .w{font-size:12px;color:var(--ink-3);margin-top:2px}

/* ---------- Feed ---------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.toolbar .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{opacity:.65}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.select,.search input{height:32px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:0 12px;outline:none;min-width:0;font-size:13px}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:11px;color:var(--ink-3);pointer-events:none}
.search input{padding-left:32px;width:220px}
.wk{margin-bottom:28px}
.wk-h{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--line-2)}
.wk-h h2{font-size:16px;font-weight:500}
.wk-h .th{color:var(--ink-2)}
.wk-h .dt{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:18px 12px}
.tile{display:flex;flex-direction:column;gap:10px;border:0;padding:0;background:none;text-align:left;color:inherit;min-width:0}
.tile .cover{transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.tile:hover .cover{transform:translateY(-3px);box-shadow:var(--pop)}
.tile-m{display:flex;flex-direction:column;gap:6px;min-width:0}
.tile-m .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tile-m .d{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.tile-m .f{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .flag{position:absolute;top:8px;left:8px;z-index:1}
.tblwrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{font:500 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr[data-open]{cursor:pointer}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td.hook{min-width:300px;font-weight:500}

/* ---------- Board ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:10px;overflow-x:auto;padding-bottom:12px;align-items:start;scroll-snap-type:x mandatory;scrollbar-width:thin}
.col{background:color-mix(in srgb,var(--sunken) 70%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:180px;scroll-snap-align:start}
.col-h{display:flex;align-items:center;gap:8px;padding:6px 6px 0}
.col-h b{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.col-h .n{font:500 11px var(--f-mono);color:var(--ink-3)}
.col-h .who{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.col-h .who .av{width:20px;height:20px;font-size:9.5px}
.col-bar{height:2px;margin:2px 6px 4px}
.kc{display:flex;flex-direction:column;gap:9px;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;color:inherit;width:100%;transition:border-color .15s,transform .15s}
.kc:hover{border-color:var(--line-2);transform:translateY(-1px)}
.kc.late{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.kc-t{font-weight:500;line-height:1.38;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.col-empty{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:16px 10px;text-align:center}
.tg{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r);font:500 9.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;background:var(--wait-soft);color:var(--ink-2)}
.tg.p{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.tg.p::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.tg.bad{background:var(--bad-soft);color:var(--bad)}
.tg.you{background:var(--you-soft);color:var(--you-text)}
.tg.info{background:var(--accent-soft);color:var(--accent-text)}
.tg.ok{background:var(--ok-soft);color:var(--ok-text)}
.kc-meta{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--ink-3);flex-wrap:wrap;row-gap:4px}
.kc-meta span{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.kid{font:500 11px var(--f-mono);color:var(--accent-text);margin-right:7px}
.kc-meta .over{color:var(--bad)}
.kc-f{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px dashed var(--line-2)}
.kc-f .mono{font-size:11px;color:var(--ink-3)}
.kc-f .av{margin-left:auto;width:22px;height:22px;font-size:10px}

/* ---------- Jadwal ---------- */
.gwrap{overflow-x:auto}
.gantt{--dw:34px;--lw:250px;position:relative;width:calc(var(--lw) + var(--days) * var(--dw))}
.g-row{display:grid;grid-template-columns:var(--lw) calc(var(--days) * var(--dw));min-height:46px}
.g-row.head{min-height:72px;border-bottom:1px solid var(--line-2)}
.g-lab{position:sticky;left:0;z-index:3;background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 16px;border:0;border-right:1px solid var(--line);text-align:left;color:inherit;min-width:0}
.g-lab .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
button.g-lab:hover .t{color:var(--accent-text)}
.g-tr{position:relative}
.g-days{display:grid;grid-template-columns:repeat(var(--days),var(--dw))}
.g-days div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;font:500 9.5px var(--f-mono);color:var(--ink-3);line-height:1.4}
.g-days b{font:500 12px/22px var(--f-mono);width:24px;height:22px;text-align:center;color:var(--ink-2)}
.g-days .td b{background:var(--accent);color:#ffffff}
.g-bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--days),var(--dw));pointer-events:none}
.g-bg div{border-right:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.g-bg .we{background:color-mix(in srgb,var(--sunken) 80%,transparent)}
.g-bar{position:absolute;top:50%;height:30px;transform:translateY(-50%);border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 5px 0 10px;font:500 12px/1 var(--f-sans);overflow:hidden;white-space:nowrap;min-width:8px;border:0;transition:filter .15s}
.g-bar:hover{filter:brightness(1.1)}
.g-bar .gl-t{overflow:hidden;text-overflow:ellipsis;font-family:var(--f-mono);font-size:11px}
.g-bar .gl-s{font-family:var(--f-sans);opacity:.75;margin-left:4px}
.g-bar .nd{font:500 10px/1 var(--f-mono);padding:5px 6px;border-radius:1px;background:rgba(255,255,255,.95);color:#0d0f14;flex:none}
.b-wait{background:var(--wait-soft);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.b-team{background:linear-gradient(90deg,#0346d6,#236ef3 60%,#4f86ff);color:#ffffff;box-shadow:0 8px 20px -12px #236ef3}
.b-you{background:var(--you);color:#1a1206}
.b-done{background:var(--ink);color:var(--bg)}
.b-done .nd{background:var(--bg);color:var(--ink)}
.b-wait .nd{background:var(--line-2);color:var(--ink)}
.g-bar.late{box-shadow:inset 0 0 0 2px var(--bad)}
.g-wait{position:absolute;top:50%;border-top:1px dashed var(--line-2)}
.g-pub{position:absolute;top:50%;width:11px;height:11px;transform:translate(-50%,-50%) rotate(45deg);background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.g-pub.done{background:var(--ok)}
.g-ms{position:absolute;top:50%;height:24px;transform:translateY(-50%);border-radius:var(--r);background:var(--accent-soft);color:var(--accent-text);font-size:12px;font-weight:500;padding:0 10px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.g-now{position:absolute;top:2px;bottom:0;width:1px;background:var(--accent);box-shadow:0 0 10px var(--accent);z-index:2;pointer-events:none}
.g-now span{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--accent);color:#ffffff;font:500 9.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;white-space:nowrap}
.g-sec{position:sticky;left:0;width:var(--lw);padding:16px 16px 6px;font:500 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);background:var(--surface);z-index:3;border-top:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px}
.legend span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.legend i{width:20px;height:10px;flex:none}
.agenda{display:none}
.agenda .wk{margin-bottom:22px}
.ag-row{display:grid;grid-template-columns:52px 40px minmax(0,1fr);gap:12px;align-items:center;padding:10px 6px;margin:0 -6px;border-radius:var(--r);background:none;border:0;width:calc(100% + 12px);text-align:left;color:inherit}
.ag-row:hover{background:var(--hover)}
.ag-day{display:flex;flex-direction:column;line-height:1.15}
.ag-day span{font:500 10px var(--f-mono);text-transform:uppercase;color:var(--ink-3)}
.ag-day b{font:300 24px/1.1 var(--f-sans);letter-spacing:-.04em}
.ag-day.is-today b,.ag-day.is-today span{color:var(--accent-text)}
.ag-t{font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ag-m{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}

/* ---------- Rencana ---------- */
.wcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wc{padding:16px;gap:12px}
.wc.now{--t:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:0 0 0 3px var(--accent-soft)}
.wc .dt{font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.wc h3{font-size:17px;font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wc .th{color:var(--accent-text);margin-top:-6px}
.wc .covers{display:flex;gap:6px;flex-wrap:wrap}
.wc .covers button{width:44px;padding:0;border:0;background:none}
.wc .covers .cover{padding:6%}
.wc .covers .cover .cv{font-size:12cqi;-webkit-line-clamp:4}
.wc .prog{display:flex;align-items:center;gap:10px;font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-top:auto}
.plan2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px;margin-top:10px;align-items:start}
.ck-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0}
.ck-row + .ck-row{border-top:1px solid var(--line)}
.ckb{width:18px;height:18px;border-radius:1px;border:0;box-shadow:inset 0 0 0 1px var(--ink-3);display:grid;place-items:center;background:none;color:#04150c;padding:0}
.ckb.on{background:var(--ok);box-shadow:none}
.ckb:hover{box-shadow:inset 0 0 0 1px var(--ok)}
.ck-row.done .t{color:var(--ink-3);text-decoration:line-through}
.ck-row .w{font-size:12px;color:var(--ink-3);margin-top:2px}

/* ---------- Aktivitas ---------- */
.act{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px;align-items:start}

/* ---------- Sales ---------- */
.funnel{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.fr{display:grid;grid-template-columns:96px minmax(0,1fr) 46px 52px;gap:12px;align-items:center}
.fr .lbl{color:var(--ink-2)}
.fr .trk2{height:16px;background:var(--inset);position:relative;overflow:hidden}
.fr .trk2 i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 55%,transparent),var(--accent));transition:width .7s var(--ease)}
.fr.deal .trk2 i{background:var(--ok)}
.fr b{font:400 18px/1 var(--f-sans);letter-spacing:-.03em;text-align:right;font-variant-numeric:tabular-nums}
.fr .cv{font:500 10px var(--f-mono);color:var(--ink-3);text-align:right}
.tgt{display:flex;flex-direction:column;gap:16px}
.tgt-r{display:flex;flex-direction:column;gap:8px}
.tgt-r .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tgt-r .big{font:300 30px/1 var(--f-sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tgt-r .big small{font:400 12px var(--f-mono);color:var(--ink-3);margin-left:4px;letter-spacing:0}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:26px;height:8px;background:var(--inset)}
.pips i.on{background:var(--ok)}
.tgt-r p{font-size:12px;color:var(--ink-3)}
.alur{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.st8{background:var(--surface);padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.st8 .n{font:500 10px var(--f-mono);color:var(--ink-3);letter-spacing:.08em}
.st8 b{font-weight:500;font-size:13px;line-height:1.25}
.st8 .who{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.st8 .who .av{width:20px;height:20px;font-size:9.5px}
.st8 .c{font:300 26px/1 var(--f-sans);letter-spacing:-.04em;margin-top:auto;font-variant-numeric:tabular-nums}
.st8 .c small{font:400 10px var(--f-mono);color:var(--ink-3);letter-spacing:0;margin-left:4px}
.st8 .c.none{color:var(--ink-3)}
.st8 .gate{align-self:flex-start}
.st8.hot{background:linear-gradient(180deg,var(--accent-soft),var(--surface))}
.guide ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.guide li{background:var(--surface);padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-content:start}
.guide li .n{width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line-2);font-size:11px;color:var(--ink-2)}
.guide code{display:inline-block;background:var(--accent-soft);color:var(--accent-text);padding:3px 6px;margin-bottom:8px}
.guide p{font-size:13px;color:var(--ink-2)}
.guide p + p{margin-top:6px;font-size:12px}
.msg-dm{max-width:440px;margin-left:auto;padding:12px 14px;border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,#2a62ff,#5b3fe0);color:#ffffff;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 14px 34px -18px rgba(42,98,255,.9)}
.msg-mail{border:1px solid var(--line-2);background:var(--sunken)}
.msg-mail .mh{display:grid;grid-template-columns:64px minmax(0,1fr);gap:6px 10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}
.msg-mail .mh span{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-top:2px}
.msg-mail .mh b{font-weight:500;overflow-wrap:anywhere}
.msg-mail .mb{padding:14px;font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.msg-in{padding:10px 12px;border-left:2px solid var(--ink-3);background:var(--sunken);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}
.meter-l{display:flex;justify-content:space-between;gap:10px;font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:10px}
.meter-l .over{color:var(--bad)}
.sends{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.send-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 16px 0}
.send-h b{font-weight:500;font-size:15px}
.send-b{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.send-to{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.addr{font:500 12.5px var(--f-mono);color:var(--ink);user-select:all;overflow-wrap:anywhere}
.msgbox{position:relative;border:1px solid var(--line-2);background:var(--sunken);padding:12px 14px;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.send-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px 14px;border-top:1px dashed var(--line-2);margin-top:auto}
.sbar{display:flex;height:10px;gap:2px;margin:6px 0 12px}
.sbar i{display:block;min-width:4px}
.skor{display:flex;align-items:center;gap:8px}
.skor .t{position:relative;width:54px;height:4px;background:var(--inset)}
.skor .t i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.skor .t::after{content:"";position:absolute;left:60%;top:-3px;bottom:-3px;width:1px;background:var(--ink-3)}
.kamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.kp{padding:16px;gap:12px}
.kp h3{font-size:16px;font-weight:500;line-height:1.3}
.kp .meta{font-size:12.5px;color:var(--ink-2)}
.kp .nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kp .nums div{background:var(--surface);padding:9px 10px;display:flex;flex-direction:column;gap:4px}
.kp .nums b{font:300 22px/1 var(--f-sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lr{position:relative;height:8px;background:var(--inset);margin-top:22px}
.lr i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.lr .mk{position:absolute;top:-18px;bottom:-3px;width:1px;background:var(--ink-3)}
.lr .mk span{position:absolute;top:0;left:4px;font:500 9px var(--f-mono);color:var(--ink-3);white-space:nowrap}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:10px}
.rules div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2)}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);z-index:50;background:linear-gradient(180deg,var(--raised),var(--surface));border-left:1px solid var(--line-2);box-shadow:var(--pop);display:flex;flex-direction:column;transform:translateX(104%);visibility:hidden;transition:transform .34s var(--ease),visibility 0s .34s;padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none;visibility:visible;transition:transform .34s var(--ease)}
.dr-head{display:flex;flex-direction:column;gap:12px;padding:18px 20px 16px;border-bottom:1px solid var(--line)}
.dr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dr-top .x{margin-left:auto}
.dr-head h2{font:400 21px/1.25 var(--f-sans);letter-spacing:-.03em}
.dr-body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.steps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.step{display:flex;flex-direction:column;gap:6px;font:500 9px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);min-width:0}
.step span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step i{height:3px;background:var(--inset)}
.step.done i{background:var(--accent)}
.step.cur{color:var(--ink)}

.pal-i{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:40px;padding:6px 10px;border:1px solid transparent;border-radius:var(--r);background:none;color:var(--ink-2);text-align:left}

.rt::before{content:"";position:absolute;left:89px;top:0;bottom:0;width:1px;background:var(--line)}
.rt:first-child::before{top:50%}.rt:last-child::before{bottom:50%}

.rt.on .rt-t{color:var(--ink)}

@property --gr{syntax:'<length>';inherits:false;initial-value:0px}

  background:radial-gradient(var(--gr) circle at var(--mx,0px) var(--my,50%),color-mix(in srgb,var(--ink) 55%,transparent) 0%,color-mix(in srgb,var(--ink) 20%,transparent) 45%,transparent 100%);

<script>
/* latar: grid titik yang menyala mengikuti kabut noise yang mengalir (ala preloader cipher.tv).
   Muncul dari kosong saat halaman dibuka, lalu bergerak pelan. Statis kalau reduced-motion. */
(() => {
  const cv = document.getElementById("bgfx"), cx = cv && cv.getContext("2d");
  if (!cx) return;
  const P = 12, D = 2, FPS = 24, INTRO = 2200;
  const perm = new Uint8Array(512);
  { const a = Array.from({length:256}, (_, i) => i); for (let i = 255; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } for (let i = 0; i < 512; i++) perm[i] = a[i & 255]; }
  const h = (i, j, k) => perm[(perm[(perm[i & 255] + j) & 255] + k) & 255] / 255;
  const sm = t => t * t * (3 - 2 * t), lerp = (a, b, t) => a + (b - a) * t;
  function noise(x, y, z){
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), u = sm(x - xi), v = sm(y - yi), w = sm(z - zi);
    const a = lerp(lerp(h(xi, yi, zi), h(xi + 1, yi, zi), u), lerp(h(xi, yi + 1, zi), h(xi + 1, yi + 1, zi), u), v);
    const b = lerp(lerp(h(xi, yi, zi + 1), h(xi + 1, yi, zi + 1), u), lerp(h(xi, yi + 1, zi + 1), h(xi + 1, yi + 1, zi + 1), u), v);
    return lerp(a, b, w);
  }
  let W = 0, H = 0, cols = 0, rows = 0, rnd = null, color = "", last = 0, t0 = performance.now(), raf = 0;
  const still = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const readColor = () => { color = getComputedStyle(document.documentElement).getPropertyValue("--dot").trim() || "rgba(226,230,242,.1)"; };
  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(W / P) + 1; rows = Math.ceil(H / P) + 1;
    rnd = new Float32Array(cols * rows); for (let i = 0; i < rnd.length; i++) rnd[i] = Math.random() - .5;
  }
  function draw(t, th){
    cx.clearRect(0, 0, W, H); cx.fillStyle = color;
    const o = (P - D) / 2;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const n = .7 * noise(i * .032 + t * .2, j * .032 - t * .09, t * .14) + .3 * noise(i * .09 - t * .16, j * .09 + t * .05, t * .26 + 9);
      if (.5 + (n - .5) * 2.6 + rnd[j * cols + i] * .28 > th) cx.fillRect(i * P + o, j * P + o, D, D);
    }
  }
  function frame(now){
    raf = requestAnimationFrame(frame);
    if (document.hidden || now - last < 1000 / FPS) return;
    last = now;
    const e = now - t0, p = Math.min(e / INTRO, 1), th = lerp(1.9, .62, 1 - Math.pow(1 - p, 3));
    draw(e / 1000, th);
  }
  function start(){
    cancelAnimationFrame(raf);
    if (still()) { draw(3, .62); return; }
    raf = requestAnimationFrame(frame);
  }
  readColor(); resize(); start();
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { resize(); if (still()) draw(3, .62); }, 120); });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColor);
  window.matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", start);
  new MutationObserver(readColor).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
})();
</script>

/* ---------- kirim ke inbox, dengan jeda batal ---------- */
async function send(type, payload){
  if (!db) { toast("Belum tersambung ke board. Coba lagi sebentar."); return false; }
  try {
    await db.collection("inbox").add({type, status:"new", at:new Date().toISOString(), by:me || null, ...payload});
    return true;
  } catch (e) {
    if (e && e.code === "invalid_argument") { canWrite = false; toast("Akunmu hanya bisa melihat board ini."); render(); }
    else if (e && e.code === "quota_exceeded") toast("Inbox penuh. Minta Michael merapikan inbox dulu.");
    else toast("Gagal mengirim. Cek koneksi lalu coba lagi.");
    return false;
  }
}
const keyOf = p => p.task ?? (Array.isArray(p.prospek) ? p.prospek.join(",") : p.prospek) ?? null;
function queue(type, payload, label){
  const item = {type, payload, task:keyOf(payload), item:payload.item, sent:false};
  item.timer = setTimeout(() => flush(item), UNDO_MS);
  localQ.push(item);
  render();
  toast(label, {action:"Batalkan", ms:UNDO_MS, fn:() => { if (item.sent) return; clearTimeout(item.timer); localQ = localQ.filter(x => x !== item); render(); toast("Dibatalkan"); }});
}
async function flush(item){
  if (item.sent || !localQ.includes(item)) return;
  clearTimeout(item.timer); item.sent = true;
  const ok = await send(item.type, item.payload);
  if (!ok) { localQ = localQ.filter(x => x !== item); render(); return; }
  setTimeout(() => { localQ = localQ.filter(x => x !== item); render(); }, 20000);
}
const flushAll = () => localQ.filter(x => !x.sent).forEach(flush);
window.addEventListener("pagehide", flushAll);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushAll(); });
const ckPending = i => localQ.some(x => x.type === "check" && x.item === i) || inbox.some(m => m.type === "check" && m.item === i && m.status === "new");
