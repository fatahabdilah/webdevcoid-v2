    <div class="w kpi c3"><div class="kpi-h"><span class="kpi-ic">${ic("LayoutGrid",15)}</span><span class="kpi-l">Post approved</span><button class="arrow" data-goto="plan" type="button" aria-label="Buka feed">${ic("ArrowUpRight",15)}</button></div>
      <div class="kpi-n"><span data-count="${nDone}">${nDone}</span><small>/ ${P.length} post</small></div><div class="kpi-f"><span class="pticks">${ordered.map(t => `<i style="background:var(--s-${t.stage})" data-tip="${esc(t.id + ": " + (SL[t.stage] || t.stage))}"></i>`).join("")}</span></div></div>
    <div class="w kpi c3 ${lateT.length ? "bad" : ""}"><div class="kpi-h"><span class="kpi-ic">${ic("TriangleAlert",15)}</span><span class="kpi-l">Lewat deadline</span><button class="arrow" data-goto="timeline" type="button" aria-label="Buka jadwal">${ic("ArrowUpRight",15)}</button></div>
      <div class="kpi-n"><span data-count="${lateT.length}">${lateT.length}</span><small>task</small></div><div class="kpi-f">${lateT.length ? lateT.map(t => idLink(t.id)).join("") : "Semua sesuai jadwal"}</div></div>
    <div class="w kpi c3 ${ckDue.length ? "warn" : ""}"><div class="kpi-h"><span class="kpi-ic">${ic("Package",15)}</span><span class="kpi-l">Bahan belum siap</span><button class="arrow" data-goto="roadmap" type="button" aria-label="Buka rencana">${ic("ArrowUpRight",15)}</button></div>
      <div class="kpi-n"><span data-count="${ckOpen.length}">${ckOpen.length}</span><small>/ ${ck.length} bahan</small></div><div class="kpi-f">${nearest ? `Terdekat: ${esc(nearest.item.length > 34 ? nearest.item.slice(0, 33) + "…" : nearest.item)}, ${fd(nearest.due)}` : "Semua bahan siap"}</div></div>`;
  const lines = [];
  if (appr.length) lines.push(`${appr.length} task lolos QC dan menunggu keputusanmu.`);
  if (lateT.length) lines.push(`${lateT.map(t => t.id).join(", ")} lewat deadline.`);
  if (ckDue.length) lines.push(`${ckDue.length} bahan harus siap paling lambat ${fd(ckDue.map(c => c.due).sort()[0])}.`);
  const nAsk = q.filter(x => x.k !== "rev").length;
  return `<section class="view">
    <header class="vh"><div><h1><span class="soft">Halo, Mic.</span> ${nAsk ? `Ada ${nAsk} hal yang perlu kamu putuskan.` : "Hari ini aman."}</h1><p class="lede">${HARI_L[t0.getDay()]}, ${t0.getDate()} ${BULAN_L[t0.getMonth()]}. ${esc(lines.join(" ") || "Tim jalan sesuai jadwal.")}</p></div>
      <div class="vh-act"><button class="btn" data-cmd="" type="button">${ic("Send",14)}Perintah</button><button class="btn primary" data-goto="approval" type="button">Buka approval${ic("ArrowRight",14)}</button></div></header>
    <div class="bento">
      ${kpis}
      <section class="w c12 w-now">${workNow()}</section>
      ${spot}
      <section class="w c3 w-cal"><div class="w-h"><h2>Kalender tayang</h2></div><div class="w-b" style="padding-top:4px">${calendar()}</div></section>
      <section class="w c5 w-chart"><div class="w-h"><h2>Target bulan ini</h2><button class="btn sm ghost" data-goto="timeline" type="button">Jadwal</button></div><div class="w-b">${chartPlan()}</div></section>
      <div class="c7 stackcol w-q">
      <section class="w"><div class="w-h"><h2>Perlu kamu</h2><span class="sub">${q.length} hal</span></div><div class="w-b" style="padding-top:4px"><div class="qf">${QF.map(([k, l]) => `<button class="chip" type="button" data-qf="${k}" aria-pressed="${qFilter === k}">${l} <span class="n">${k === "all" ? q.length : q.filter(x => x.k === k).length}</span></button>`).join("")}</div>${qRows.length ? qRows.join("") : `<div class="empty"><b>Semua beres</b>Post yang lolos QC, telat, atau bahan yang jatuh tempo muncul di sini.</div>`}</div></section>
      <section class="w"><div class="w-h"><h2>Aktivitas tim</h2><span class="sub">14 hari terakhir</span></div><div class="w-b">${heatmap()}</div></section>
      </div>
      <div class="c5 stackcol w-team">
      <section class="w"><div class="w-h"><h2>Terakhir terjadi</h2><button class="btn sm ghost" data-goto="aktivitas" type="button">Semua</button></div><div class="w-b" style="padding-top:2px"><div class="feed">${feedItems([...(S.log || [])].reverse().slice(0, 5))}</div></div></section>
      </div>
    </div></section>`;
}

/* ---------- Design: Approval ---------- */
function apprLists(){
  const open = tasks().filter(t => !DONE.has(t.stage));
  const ready = open.filter(t => t.stage === "approval").sort(sortPub);
  const rank = t => late(t) ? 0 : 1;
  const rest = open.filter(t => t.stage !== "approval").sort((a, b) => rank(a) - rank(b) || sortPub(a, b));
  return {ready, rest};
}
function vApproval(){
  const {ready, rest} = apprLists();
  if (!apprFilter) apprFilter = ready.length ? "ready" : "all";
  const list = apprFilter === "ready" ? ready : [...ready, ...rest];
  if (apprSel && !byId(apprSel)) apprSel = null;
  if (!apprSel && !isNarrow() && list.length) apprSel = list[0].id;
  const sel = apprSel && byId(apprSel);
  const item = t => `<button class="al-i" data-asel="${esc(t.id)}" aria-current="${t.id === apprSel}" type="button">${thumb(t)}<span style="min-width:0"><span class="t">${esc(t.hook || t.title)}</span><span class="m"><span class="id">${esc(t.id)}</span><span class="d">${t.publish ? fd(t.publish) : "Deadline " + fd(t.due)}</span>${t.stage === "approval" ? `<span class="tag t-you">Siap</span>` : ""}${flags(t)}</span></span></button>`;
  let listHtml;
  if (apprFilter === "ready") listHtml = ready.length ? ready.map(item).join("") : `<div class="empty" style="margin:8px"><b>Belum ada yang lolos QC</b>Kamu tetap bisa approve task yang masih dikerjakan atau telat.<button class="btn sm" data-afilter="all" type="button">Lihat ${rest.length} task lain</button></div>`;
  else listHtml = (ready.length ? `<div class="al-group">Lolos QC</div>${ready.map(item).join("")}` : "") + (rest.length ? `<div class="al-group">Belum approved, masih di tim</div>${rest.map(item).join("")}` : "") || `<div class="empty" style="margin:8px"><b>Semua sudah approved</b></div>`;
  const detail = sel ? `<article class="panel ad">
      <div class="ad-head"><div class="row1"><button class="btn sm ghost back" data-asel="" type="button">${ic("ArrowLeft",14)}Daftar</button><span class="id">${esc(sel.id)}</span>${stageTag(sel.stage)}${flags(sel)}${sel.figma ? `<a class="btn sm ghost" style="margin-left:auto" href="${esc(sel.figma)}" target="_blank" rel="noopener">${ic("Figma",14)}Figma</a>` : ""}</div>
        <h2>${esc(sel.hook || sel.title)}</h2>${facts(sel)}</div>
      ${slidesBlock(sel)}
      <div class="sec">${docsBlock(sel)}</div>
      ${feedbackBlock(sel)}
      ${decideBar(sel, "a")}
    </article>` : `<div class="panel ad"><div class="state" style="padding:40px 24px"><h2>Pilih item di kiri</h2><p>Detail slide, copy, dan tombol keputusan muncul di sini.</p></div></div>`;
  return `<section class="view">
    <header class="vh"><div><h1>Approval</h1><p class="lede">${ready.length ? `${ready.length} post lolos QC Michael.` : "Belum ada post yang lolos QC."} Kamu bisa approve atau minta revisi untuk task mana pun yang belum approved, termasuk yang telat.</p></div></header>
    <div class="appr ${sel && isNarrow() ? "has-sel" : ""}">
      <aside class="panel al"><div class="seg" role="group" aria-label="Filter"><button type="button" data-afilter="ready" aria-pressed="${apprFilter === "ready"}">Lolos QC <span class="n">${ready.length}</span></button><button type="button" data-afilter="all" aria-pressed="${apprFilter === "all"}">Semua belum approved <span class="n">${ready.length + rest.length}</span></button></div>
        <div class="al-list">${listHtml}</div></aside>
      ${detail}
    </div></section>`;
}

/* ---------- Design: Feed ---------- */
function filteredPosts(){
  let list = posts();
  if (filt.pillar) list = list.filter(t => t.pillar === filt.pillar);
  if (filt.stage) list = list.filter(t => groupOf(t.stage) === filt.stage);
  if (filt.q) { const q = filt.q.toLowerCase(); list = list.filter(t => (t.id + " " + t.title + " " + (t.hook || "")).toLowerCase().includes(q)); }
  return [...list].sort(sortPub);
}
function vPlan(){
  const list = filteredPosts();
  const counts = Object.fromEntries(PILLARS.map(p => [p, posts().filter(t => t.pillar === p).length]));
  const tile = t => `<button class="tile" data-open="${esc(t.id)}" type="button"><span style="position:relative;display:block">${late(t) ? `<span class="tag t-bad flag">Telat</span>` : ""}${cover(t)}</span>
    <span class="tile-m"><span class="r"><span class="d"><span class="id">${esc(t.id)}</span>&ensp;${fd(t.publish)}</span>${stageTag(t.stage)}</span><span class="f"><i class="pdot" style="background:${pillarVar(t.pillar)};margin-right:6px"></i>${esc(t.pillar)}, ${esc(t.format)}</span></span></button>`;
  let body;
  if (!list.length) body = `<div class="empty"><b>Tidak ada post yang cocok</b>Ubah filter atau kata kunci pencarian.<button class="btn sm" data-fclear type="button">Hapus filter</button></div>`;
  else if (feedMode === "grid") {
    body = (S.milestones || []).map(m => { const items = list.filter(t => t.week === m.id); if (!items.length) return ""; return `<section class="wk"><div class="wk-h"><h2>${esc(m.title)}</h2><span class="th">${esc(m.theme)}</span><span class="dt">${fd(m.start,false)} sampai ${fd(m.end,false)}</span></div><div class="grid">${items.map(tile).join("")}</div></section>`; }).join("");
    const orphan = list.filter(t => !(S.milestones || []).some(m => m.id === t.week));
    if (orphan.length) body += `<section class="wk"><div class="wk-h"><h2>Lainnya</h2></div><div class="grid">${orphan.map(tile).join("")}</div></section>`;
  } else {
    body = `<div class="panel"><div class="tblwrap"><table class="tbl"><thead><tr><th>ID</th><th>Tayang</th><th>Hook sampul</th><th>Pilar</th><th>Format</th><th>Ajakan</th><th>Status</th><th>Pegang</th></tr></thead><tbody>
      ${list.map(t => `<tr data-open="${esc(t.id)}" tabindex="0"><td class="id">${esc(t.id)}</td><td class="mono" style="white-space:nowrap">${fd(t.publish)}</td><td class="hook">${esc(t.hook || t.title)} ${late(t) ? `<span class="tag t-bad">Telat</span>` : ""}</td><td style="white-space:nowrap"><i class="pdot" style="background:${pillarVar(t.pillar)};margin-right:7px"></i>${esc(t.pillar)}</td><td style="white-space:nowrap">${esc(t.format)}</td><td>${esc(t.cta)}</td><td>${stageTag(t.stage)}</td><td>${av(t.owner)}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  return `<section class="view">
    <header class="vh"><div><h1>Feed</h1><p class="lede">${posts().length} post dari 15 Okt sampai 15 Nov. Empat post pembuka, lalu Senin, Rabu, dan Jumat pukul 19.00.</p></div>
      <div class="seg" role="group" aria-label="Tampilan"><button type="button" data-fmode="grid" aria-pressed="${feedMode === "grid"}">${ic("LayoutGrid",13)}Grid</button><button type="button" data-fmode="table" aria-pressed="${feedMode === "table"}">${ic("Rows3",13)}Tabel</button></div></header>
    <div class="toolbar"><div class="chips"><button class="chip" aria-pressed="${!filt.pillar}" data-fpillar="" type="button">Semua pilar</button>${PILLARS.map(p => `<button class="chip" aria-pressed="${filt.pillar === p}" data-fpillar="${p}" type="button"><i class="pdot" style="background:${pillarVar(p)}"></i>${p} <span class="n">${counts[p]}</span></button>`).join("")}</div>
      <span class="grow"></span>
      <select class="select" id="f-stage" aria-label="Filter status"><option value="">Semua status</option>${GROUPS.map(([g,l]) => `<option value="${g}" ${filt.stage === g ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
      <label class="search">${ic("Search",14)}<input id="f-q" type="search" placeholder="Cari hook atau ID" value="${esc(filt.q)}" aria-label="Cari hook atau ID"></label></div>
    ${body}</section>`;
}

/* ---------- Design: Board ---------- */
function vKanban(){
  const t0 = today();
  const cols = STAGES.map(([k, label, owner]) => {
    const items = tasks().filter(t => t.stage === k).sort(sortPub);
    return `<div class="col"><div class="col-h"><b>${esc(label)}</b><span class="n">${items.length}</span><span class="who">${esc(agentName(owner))}${av(owner)}</span></div><div class="col-bar" style="background:var(--s-${k})"></div>
      ${items.map(t => {
        const due = pd(t.due), left = due ? dd(t0, due) : null, nDocs = Object.keys((S.docs || {})[t.id] || {}).length, i = stageIdx(t.stage);
        return `<button class="kc ${late(t) ? "late" : ""}" data-open="${esc(t.id)}" type="button">
          <span style="display:flex;gap:5px;flex-wrap:wrap">${t.pillar ? `<span class="tg p" style="--c:${pillarVar(t.pillar)}">${esc(t.pillar)}</span>` : `<span class="tg">Setup</span>`}${t.format ? `<span class="tg">${esc(t.format)}</span>` : ""}${late(t) ? `<span class="tg bad">Telat</span>` : ""}${openFb(t).length && !DONE.has(t.stage) ? `<span class="tg you">Revisi</span>` : ""}${pending(t.id).length ? `<span class="tg info">Menunggu Michael</span>` : ""}</span>
          <span class="kc-t"><span class="kid">${esc(t.id)}</span>${esc(t.hook || t.title)}</span>
          <span class="kc-meta"><span title="Tanggal tayang">${ic("CalendarDays",13)}${t.publish ? fd(t.publish) : "-"}</span>${nDocs ? `<span title="Dokumen">${ic("FileText",13)}${nDocs}</span>` : ""}${(t.feedback || []).length ? `<span title="Revisi">${ic("MessageSquareText",13)}${t.feedback.length}</span>` : ""}${left != null && !DONE.has(t.stage) ? `<span class="${left < 0 ? "over" : ""}" title="Deadline ${fd(t.due)}">${ic("Clock",13)}${left < 0 ? "telat " + Math.abs(left) + " hari" : left === 0 ? "hari ini" : left + " hari"}</span>` : ""}</span>
          <span class="kc-f">${ticks(t.stage)}<span class="mono">${i + 1}/${STAGES.length}</span>${av(t.owner)}</span></button>`;
      }).join("") || `<div class="col-empty">Kosong</div>`}</div>`;
  }).join("");
  return `<section class="view"><header class="vh"><div><h1>Board</h1><p class="lede">Satu kolom satu tahap, urut sesuai alur kerja. Garis kecil di bawah kartu menunjukkan tahap ke berapa dari delapan.</p></div></header><div class="board">${cols}</div></section>`;
}

/* ---------- Design: Jadwal ---------- */
function vTimeline(){
  const [a, b] = (S.project && S.project.period) || ["2026-10-14","2026-11-16"];
  const p0 = pd(a), p1 = pd(b), N = dd(p0, p1) + 1, t0 = today();
  const x = d => dd(p0, d);
  const days = Array.from({length:N}, (_, i) => new Date(p0.getFullYear(), p0.getMonth(), p0.getDate() + i));
  const we = d => d.getDay() === 0 || d.getDay() === 6;
  const bg = `<div class="g-bg">${days.map(d => `<div class="${we(d) ? "we" : ""}"></div>`).join("")}</div>`;
  const head = `<div class="g-row head"><div class="g-lab"><span class="lbl">Task</span></div><div class="g-days">${days.map(d => `<div class="${+d === +t0 ? "td" : ""}">${d.getDate() === 1 || +d === +p0 ? `<span style="color:var(--ink)">${BULAN[d.getMonth()]}</span>` : ""}<span>${HARI[d.getDay()][0]}</span><b>${d.getDate()}</b></div>`).join("")}</div></div>`;
  const msRows = (S.milestones || []).map(m => { const s = Math.max(0, x(pd(m.start))), e = Math.min(N - 1, x(pd(m.end))); return `<div class="g-row"><div class="g-lab"><span class="t" style="font-weight:500">${esc(m.title)}</span></div><div class="g-tr">${bg}<div class="g-ms" style="left:calc(${s} * var(--dw) + 3px);width:calc(${e - s + 1} * var(--dw) - 6px)" data-tip="${esc(m.title + "\n" + fd(m.start,false) + " sampai " + fd(m.end,false))}">${esc(m.theme)}</div></div></div>`; }).join("");
  const order = [...tasks()].sort((p, q) => (p.type === "post" ? 1 : 0) - (q.type === "post" ? 1 : 0) || sortPub(p, q));
  const rows = order.map(t => {
    const s = pd(t.start) || p0, e = pd(t.due) || s, pub = pd(t.publish);
    const xs = Math.max(0, x(s)), xe = Math.min(N - 1, Math.max(xs, x(e))), w = xe - xs + 1;
    const tip = `${t.id}: ${SL[t.stage]}, ${agentName(t.owner)}\nProduksi ${fd(t.start)} sampai ${fd(t.due)}${pub ? "\nTayang " + fd(t.publish) + ", 19.00" : ""}${late(t) ? "\nLewat deadline" : ""}`;
    let tr = `<button class="g-bar b-${groupOf(t.stage)} ${late(t) ? "late" : ""}" data-open="${esc(t.id)}" type="button" style="left:calc(${xs} * var(--dw) + 3px);width:calc(${w} * var(--dw) - 6px)" data-tip="${esc(tip)}"><span class="gl-t">${w >= 2 ? esc(t.id) : ""}${w >= 5 ? ` <span class="gl-s">${esc(SL[t.stage])}</span>` : ""}</span>${w >= 4 ? `<span class="nd">${w} hari</span>` : ""}</button>`;
    if (pub) {
      const xp = x(pub);
      if (xp > xe + 1) tr += `<div class="g-wait" style="left:calc(${xe + 1} * var(--dw));width:calc(${xp - xe - 1} * var(--dw) + var(--dw) / 2 - 7px)"></div>`;
      tr += `<div class="g-pub ${DONE.has(t.stage) ? "done" : ""}" style="left:calc(${xp} * var(--dw) + var(--dw) / 2)" data-tip="${esc(t.id + " tayang " + fd(t.publish) + ", 19.00")}"></div>`;
    }
    return `<div class="g-row"><button class="g-lab" data-open="${esc(t.id)}" type="button"><span class="id">${esc(t.id)}</span><span class="t">${esc(t.hook || t.title)}</span></button><div class="g-tr">${bg}${tr}</div></div>`;
  }).join("");
  const now = (t0 >= p0 && t0 <= p1) ? `<div class="g-now" style="left:calc(var(--lw) + ${x(t0)} * var(--dw) + var(--dw) / 2)"><span>Hari ini</span></div>` : "";
  const lg = [["b-wait","Belum mulai"],["b-team","Dikerjakan tim"],["b-you","Menunggu kamu"],["b-done","Approved"]];
  const agenda = (S.milestones || []).map(m => {
    const items = tasks().filter(t => { const d = pd(t.publish || t.due); return d && d >= pd(m.start) && d <= pd(m.end); }).sort(sortPub);
    if (!items.length) return "";
    return `<section class="wk"><div class="wk-h"><h2>${esc(m.title)}</h2><span class="dt">${fd(m.start,false)} sampai ${fd(m.end,false)}</span></div><div class="panel"><div class="panel-b" style="padding-top:6px">${items.map(t => { const d = pd(t.publish || t.due); return `<button class="ag-row" data-open="${esc(t.id)}" type="button"><span class="ag-day ${+d === +t0 ? "is-today" : ""}"><span>${HARI[d.getDay()]}</span><b>${d.getDate()}</b></span>${thumb(t)}<span style="min-width:0"><span class="ag-t">${esc(t.hook || t.title)}</span><span class="ag-m"><span class="id">${esc(t.id)}</span><span>${t.publish ? "tayang 19.00" : "deadline"}</span>${stageTag(t.stage)}${late(t) ? `<span class="tag t-bad">Telat</span>` : ""}</span></span></button>`; }).join("")}</div></div></section>`;
  }).join("");
  return `<section class="view"><header class="vh"><div><h1>Jadwal</h1><p class="lede">Batang adalah masa produksi sampai deadline. Belah ketupat adalah tanggal tayang. Garis biru adalah hari ini.</p></div></header>
    <div class="panel gantt-card"><div class="gwrap"><div class="gantt" style="--days:${N}">${head}<div class="g-sec">Tema mingguan</div>${msRows}<div class="g-sec">Task</div>${rows}${now}</div></div>
      <div class="panel-b" style="border-top:1px solid var(--line);padding-top:14px"><div class="legend">${lg.map(([c,l]) => `<span><i class="${c}"></i>${l}</span>`).join("")}<span><i style="box-shadow:inset 0 0 0 2px var(--bad)"></i>Telat</span><span><i style="width:10px;background:var(--ink);transform:rotate(45deg)"></i>Tayang</span></div></div></div>
    <div class="agenda">${agenda}</div></section>`;
}

/* ---------- Design: Rencana ---------- */
function vRoadmap(){
  const t0 = today(), ro = canWrite === false;
  const weeks = (S.milestones || []).map(m => {
    const s = pd(m.start), e = pd(m.end), st = s <= t0 && t0 <= e ? "now" : e < t0 ? "past" : "next";
    const items = posts().filter(t => t.week === m.id).sort(sortPub), ok = items.filter(t => DONE.has(t.stage)).length;
    return `<article class="w wc ${st === "now" ? "now" : ""}"><span class="dt">${fd(m.start,false)} sampai ${fd(m.end,false)}</span>
      <h3>${esc(m.title)}${st === "now" ? `<span class="tag t-info">Minggu ini</span>` : st === "past" ? `<span class="tag">Lewat</span>` : ""}</h3><p class="th">${esc(m.theme)}</p>
      ${items.length ? `<div class="covers">${items.map(t => `<button type="button" data-open="${esc(t.id)}" data-tip="${esc(t.id + ": " + (t.hook || t.title) + "\n" + (SL[t.stage] || t.stage))}" aria-label="${esc(t.id)}">${cover(t)}</button>`).join("")}</div>
      <div class="prog"><span class="pticks">${items.map(t => `<i style="background:var(--s-${t.stage})"></i>`).join("")}</span>${ok}/${items.length} approved</div>` : `<p class="muted" style="font-size:13px;margin-top:auto">Evaluasi bersama Fatah: pilar mana yang memancing DM, lalu susun porsi bulan depan.</p>`}</article>`;
  }).join("");

/* ---------- carousel coverflow ---------- */
function applyCars(animate){
  const g = G(), rm = reduce();
  document.querySelectorAll(".car").forEach(el => {
    const id = el.dataset.carId, items = [...el.querySelectorAll(".car-item")], n = items.length;
    const cur = Math.max(0, Math.min(n - 1, carIdx[id] || 0)); carIdx[id] = cur;
    items.forEach((it, i) => {
      const o = i - cur, a = Math.abs(o);
      const v = {xPercent:-50 + o * 64, z:-a * 150, rotationY:o * -26, autoAlpha:a > 2 ? 0 : 1 - a * .22, zIndex:20 - a};
      if (g) { if (animate && !rm) g.to(it, {...v, duration:.55, ease:"power3.out", overwrite:true}); else g.set(it, v); }
      else { it.style.transform = `translateX(${v.xPercent}%) translateZ(${v.z}px) rotateY(${v.rotationY}deg)`; it.style.opacity = v.autoAlpha; it.style.zIndex = v.zIndex; }
    });
    const pos = el.querySelector(".car-pos"); if (pos) pos.textContent = `${cur + 1} / ${n}`;
  });
}
function carStep(id, k){ const t = byId(id), n = ((t && t.previews) || []).length; carIdx[id] = Math.max(0, Math.min(n - 1, (carIdx[id] || 0) + k)); applyCars(true); }
let drag = null;
document.addEventListener("pointerdown", e => { const st = e.target.closest && e.target.closest(".car-stage"); drag = st ? {x:e.clientX, id:st.parentElement.dataset.carId, moved:false} : null; });
document.addEventListener("pointerup", e => { if (!drag) return; const dx = e.clientX - drag.x; if (Math.abs(dx) > 36) { drag.moved = true; carStep(drag.id, dx < 0 ? 1 : -1); } });

  if (view === "ringkasan" || view === "s-ringkasan") {
    g.fromTo("#main .bento > *", {y:14, autoAlpha:0}, {y:0, autoAlpha:1, duration:.42, ease:"power3.out", stagger:.035, clearProps:cc});

  }
  if (view === "ringkasan") {
    g.fromTo("#main .run, #main .sta", {y:8, autoAlpha:0}, {y:0, autoAlpha:1, duration:.35, ease:"power3.out", stagger:.03, delay:.1, clearProps:cc});

    g.fromTo("#main .heat .cell", {scale:.4, autoAlpha:0}, {scale:1, autoAlpha:1, duration:.3, ease:"power2.out", stagger:{amount:.35, from:"start"}, delay:.2, clearProps:cc});

  }
  if (view === "plan") g.fromTo("#main .tile", {y:14, autoAlpha:0}, {y:0, autoAlpha:1, duration:.4, ease:"power3.out", stagger:{each:.02, amount:.3}, clearProps:cc});
  if (view === "s-kirim" || view === "s-kampanye") g.fromTo("#main .send, #main .kp", {y:12, autoAlpha:0}, {y:0, autoAlpha:1, duration:.38, ease:"power3.out", stagger:.04, clearProps:cc});
}
function approveMoment(btn){
  return new Promise(res => {
    const g = G(), bar = btn.closest(".decide"), row = btn.closest(".q-row");
    btn.innerHTML = `${ic("Check",14)}Disetujui`;
    btn.classList.remove("primary"); btn.classList.add("ok");
    if (!g || reduce()) return setTimeout(res, 150);
    const tl = g.timeline({onComplete:res});
    tl.fromTo(btn, {scale:.9}, {scale:1, duration:.4, ease:"back.out(2.4)"});
    if (bar) tl.to(bar, {backgroundColor:"rgba(118,228,184,.14)", duration:.25, ease:"power2.out"}, 0);
    if (row) tl.to(row, {x:10, autoAlpha:.45, duration:.28, ease:"power2.in"}, .14);
    tl.to({}, {duration:.1});
  });
}

/* ---------- toast, tooltip, salin ---------- */
function toast(msg, opt = {}){
  const el = $("#toast"), g = G();
  el.innerHTML = `<span>${esc(msg)}</span>${opt.action ? `<button type="button" id="toast-act">${esc(opt.action)}</button>` : ""}`;
  el.classList.toggle("noact", !opt.action);
  toast.fn = opt.fn || null;
  el.classList.add("on");
  if (g && !reduce()) g.fromTo(el, {y:16, autoAlpha:0}, {y:0, autoAlpha:1, duration:.28, ease:"power3.out", overwrite:true});
  else el.style.visibility = "visible";
  clearTimeout(toast.t);

  setTimeout(() => { if (!S) noBoard("Board belum dikirim", "Michael belum mengirim board ke halaman ini. Di Claude Code, bilang: <b>Michael, sync dashboard</b>."); if (!SS && sState === "loading") { sState = "missing"; render(); } }, 9000);
  db.doc("board/state").onSnapshot(snap => {
    if (!snap.exists) return;
    S = snap.data(); dState = "ok"; render();
  }, err => { dState = "error"; dTitle = "Board terputus"; dMsg = "Koneksi ke board berhenti (" + esc(err && err.code) + "). Muat ulang halaman."; render(); });
  db.doc("board/sales").onSnapshot(snap => {
    if (!snap.exists) { sState = "missing"; return render(); }
    SS = snap.data(); sState = "ok"; render();
  }, () => { sState = "missing"; render(); });
  db.collection("inbox").orderBy("at", "desc").limit(200).onSnapshot(snap => {
    inbox = snap.docs.map(d => ({id:d.id, ...d.data()}));
    localQ = localQ.filter(x => !(x.sent && inbox.some(m => m.status === "new" && m.type === x.type && keyOf(m) === x.task)));
    render();
  }, () => {});
})();
})();
</script>
